<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Referral Scout — usage</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
      body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: #0e131b; color: #e8edf5; }
      main { text-align: center; padding: 40px 20px; width: 100%; max-width: 640px; }
      .count { font-size: 76px; font-weight: 800; letter-spacing: -2px; color: #8ab4f8; line-height: 1; }
      .label { color: #a3afc0; text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px; margin-top: 6px; }
      table { margin: 30px auto 0; border-collapse: collapse; width: 100%; font-size: 14px; }
      td { padding: 8px 12px; border-top: 1px solid #2a3546; text-align: left; vertical-align: top; }
      td:last-child { text-align: right; color: #75839a; white-space: nowrap; }
      a { color: #8ab4f8; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .handle { color: #75839a; font-size: 12px; }
      .muted { color: #75839a; font-size: 13px; margin-top: 26px; }
      .err { color: #f7768e; }
    </style>
  </head>
  <body>
    <main>
      <div class="count" id="count">—</div>
      <div class="label">people using Referral Scout</div>
      <table id="list"></table>
      <p class="muted" id="updated"></p>
    </main>
    <script>
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      fetch('/api/stats?t=' + Date.now())
        .then(r => r.json())
        .then(d => {
          if (d && d.error) {
            document.getElementById('count').textContent = '!';
            document.getElementById('updated').innerHTML = '<span class="err">Backend error: ' + esc(d.detail || d.error) + (d.hasToken === false ? ' — BLOB_READ_WRITE_TOKEN is not set (connect a Blob store to the project and redeploy)' : '') + '</span>';
            return;
          }
          const users = d.users || [];
          document.getElementById('count').textContent = d.count ?? users.length;
          document.getElementById('list').innerHTML = users
            .slice()
            .reverse()
            .map(u => {
              const link = 'https://www.linkedin.com/in/' + encodeURIComponent(u.id) + '/';
              const nameCell = u.name
                ? '<a href="' + link + '" target="_blank" rel="noopener">' + esc(u.name) + '</a> <span class="handle">@' + esc(u.id) + '</span>'
                : '<a href="' + link + '" target="_blank" rel="noopener">' + esc(u.id) + '</a>';
              const when = u.at ? new Date(u.at).toISOString().slice(0, 10) : '';
              return '<tr><td>' + nameCell + '</td><td>' + when + '</td></tr>';
            })
            .join('');
          document.getElementById('updated').textContent = 'Live · loaded ' + new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
        })
        .catch(e => {
          document.getElementById('count').textContent = '!';
          document.getElementById('updated').innerHTML = '<span class="err">Could not reach /api/stats: ' + esc(e && e.message) + '</span>';
        });
    </script>
  </body>
</html>
