# Rebuilds the usage dashboard from Atlas every hour and publishes it to GitHub Pages.
# IMPORTANT: a `schedule:` trigger only fires when this file is on the repository's DEFAULT branch (main).
# Keep the dashboard code on the usage-dashboard branch (this workflow checks it out), but copy THIS file to main.
name: Usage dashboard (hourly)
on:
  schedule:
    - cron: '7 * * * *' # every hour at :07
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: usage-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node build.mjs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
